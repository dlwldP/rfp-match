spring:
  application:
    name: rfp-match-api

  # 기본 프로필은 별도 설치 없이 바로 띄울 수 있도록 H2 인메모리를 쓴다.
  # MySQL(Docker/RDS)로 붙일 때는 --spring.profiles.active=mysql
  datasource:
    url: jdbc:h2:mem:rfpmatch;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  sample-data:
    # 화면을 바로 확인할 수 있도록 기동 시 예시 공고/제품을 넣는다 (데이터가 비어 있을 때만).
    enabled: true

# 공공 입찰공고 Open API 연동.
# 엔드포인트와 인증키는 코드/저장소에 남기지 않고 환경변수로만 주입한다.
bid-api:
  enabled: false
  base-url: ${BID_API_BASE_URL:}
  operation: ${BID_API_OPERATION:}
  service-key: ${BID_API_SERVICE_KEY:}
  keywords:
    - 침입방지
    - 침입차단
    - 방화벽
    - DDoS
    - 보안장비
    - 통합보안
  inqry-div: 1
  lookback-days: 7
  page-size: 100
  max-pages: 5
  timeout: 10s
  cron: "0 0 7,19 * * *"

logging:
  level:
    com.rfpmatch: DEBUG

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rfpmatch}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:rfpmatch}
    password: ${DB_PASSWORD:rfpmatch}
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

app:
  sample-data:
    # MySQL로 처음 붙일 때는 SAMPLE_DATA=true 로 띄우면 예시 데이터로 화면까지 확인할 수 있다.
    enabled: ${SAMPLE_DATA:false}

bid-api:
  # 인증키가 없으면 스케줄러가 경고만 남기고 건너뛴다. 로컬 검증 중에는 BID_API_ENABLED=false 로 꺼도 된다.
  enabled: ${BID_API_ENABLED:true}
